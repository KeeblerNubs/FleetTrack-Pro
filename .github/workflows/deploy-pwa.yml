name: Deploy FleetTrack Pro PWA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Optimize and prepare PWA assets
        run: |
          cp -R www _site
          npx --yes svgo@4.1.0 --config=svgo.config.mjs _site/icon.svg -o _site/icon.optimized.svg
          mv _site/icon.optimized.svg _site/icon.svg
          for size in 192 512; do
            npx --yes sharp-cli@6.1.0 \
              --input _site/icon.svg \
              --output "_site/icon-${size}.png" \
              --format png \
              resize "$size" "$size"
          done
          npx --yes sharp-cli@6.1.0 \
            --input _site/icon.svg \
            --output _site/apple-touch-icon.png \
            --format png \
            resize 180 180
          sed -i "s/BUILD_ID/${GITHUB_SHA}/" _site/service-worker.js

      - name: Upload PWA site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy PWA site
        id: deployment
        uses: actions/deploy-pages@v4
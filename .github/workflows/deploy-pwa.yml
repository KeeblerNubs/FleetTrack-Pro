name: Deploy FleetTrack Pro PWA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Version service worker for this commit
        run: sed -i "s/BUILD_ID/${GITHUB_SHA}/" www/service-worker.js

      - name: Upload PWA site
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

      - name: Deploy PWA site
        id: deployment
        uses: actions/deploy-pages@v4
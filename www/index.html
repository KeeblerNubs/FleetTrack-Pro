<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Company Mileage Tracker</title>
  <meta name="theme-color" content="#1e1b4b">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    .pt-safe { padding-top: env(safe-area-inset-top, 1rem); }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="bg-indigo-900 text-white pt-safe pb-4 px-4 shadow-md sticky top-0 z-30 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
        <i class="ph-bold ph-car text-indigo-400 text-2xl"></i> FleetTrack Pro
      </h1>
      <p class="text-xs text-indigo-200">Company Mileage & Admin Expense Portal</p>
    </div>
    <button id="themeToggleBtn" class="p-2 bg-indigo-800 rounded-full text-indigo-200 hover:text-white active:scale-95 transition">
      <i class="ph-bold ph-moon-stars text-xl"></i>
    </button>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-md mx-auto w-full p-4 space-y-6 pb-24">

    <!-- TAB 1: LOG TRIP (Form + GPS Tracker) -->
    <section id="tab-log" class="tab-content space-y-4">
      
      <!-- GPS Auto Tracker Widget -->
      <div class="bg-indigo-950 border border-indigo-800 rounded-2xl p-4 text-white shadow-lg relative overflow-hidden">
        <div class="flex justify-between items-center mb-3">
          <div class="flex items-center gap-2">
            <span class="relative flex h-3 w-3">
              <span id="gpsPulse" class="hidden animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span id="gpsDot" class="relative inline-flex rounded-full h-3 w-3 bg-gray-500"></span>
            </span>
            <h2 class="font-bold text-sm uppercase tracking-wider text-indigo-200">Live GPS Tracker</h2>
          </div>
          <span id="gpsStatusText" class="text-xs px-2 py-0.5 rounded bg-indigo-900 text-indigo-300">Ready</span>
        </div>

        <div class="text-center my-3">
          <div id="gpsMiles" class="text-4xl font-extrabold tracking-tight">0.0</div>
          <div class="text-xs text-indigo-300 font-medium">Miles Tracked Live</div>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-4">
          <button id="btnStartGps" onclick="startGpsTracking()" class="py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-xl text-sm flex items-center justify-center gap-2 active:scale-95 transition shadow">
            <i class="ph-bold ph-play"></i> Start GPS
          </button>
          <button id="btnStopGps" onclick="stopGpsTracking()" disabled class="py-2.5 px-3 bg-rose-600/50 text-gray-400 font-semibold rounded-xl text-sm flex items-center justify-center gap-2 cursor-not-allowed transition shadow">
            <i class="ph-bold ph-square"></i> Stop & Apply
          </button>
        </div>
      </div>

      <!-- Manual Log Form -->
      <form id="tripForm" onsubmit="saveTrip(event)" class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-200 dark:border-gray-700 space-y-4">
        <div class="flex justify-between items-center border-b pb-2 dark:border-gray-700">
          <h2 class="font-bold text-lg flex items-center gap-2">
            <i class="ph-bold ph-notebook text-indigo-600"></i> Trip Details
          </h2>
          <button type="button" onclick="autoFillStartMileage()" class="text-xs bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 px-2.5 py-1 rounded-lg border border-indigo-200 dark:border-indigo-800 flex items-center gap-1 font-medium hover:bg-indigo-100 transition">
            <i class="ph-bold ph-arrows-clockwise"></i> Sync Last Mileage
          </button>
        </div>

        <!-- Start & End Odometer -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Start Mileage *</label>
            <input type="number" step="0.1" id="startMileage" required placeholder="e.g. 45000" oninput="calculateTripDistance()"
              class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-base">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">End Mileage *</label>
            <input type="number" step="0.1" id="endMileage" required placeholder="e.g. 45025" oninput="calculateTripDistance()"
              class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-base">
          </div>
        </div>

        <!-- Auto-Calculated Total Distance -->
        <div class="bg-indigo-50 dark:bg-gray-900/50 p-3 rounded-xl border border-indigo-100 dark:border-gray-700 flex justify-between items-center">
          <span class="text-xs text-indigo-900 dark:text-indigo-300 font-medium">Calculated Distance:</span>
          <span id="calculatedDistance" class="font-extrabold text-indigo-600 dark:text-indigo-400 text-lg">0.0 mi</span>
        </div>

        <!-- Destination & Reason -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Destination *</label>
          <input type="text" id="destination" required placeholder="e.g. Regional Office / Site B"
            class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Reason for Trip *</label>
          <select id="reason" required class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="">Select Reason...</option>
            <option value="Client Visit">Client Visit</option>
            <option value="Supply Pick-up">Supply Pick-up</option>
            <option value="Site Audit">Site Audit</option>
            <option value="Staff Meeting">Staff Meeting</option>
            <option value="Maintenance / Service">Maintenance / Service</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Client Initials & Date -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Client Initials *</label>
            <input type="text" id="clientInitials" maxlength="5" required placeholder="e.g. JD" uppercase
              class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none uppercase tracking-wider">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Date *</label>
            <input type="date" id="tripDate" required
              class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md active:scale-[0.98] transition flex justify-center items-center gap-2">
          <i class="ph-bold ph-plus-circle text-xl"></i> Save Trip Record
        </button>
      </form>
    </section>

    <!-- TAB 2: TRIP HISTORY -->
    <section id="tab-history" class="tab-content hidden space-y-4">
      <div class="flex items-center gap-2">
        <input type="text" id="searchInput" oninput="renderHistory()" placeholder="Search destination, client..."
          class="flex-1 px-3 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div id="historyList" class="space-y-3">
        <!-- Dynamic Trip Cards Rendered Here -->
      </div>
    </section>

    <!-- TAB 3: ADMIN REPORT & EXPORT -->
    <section id="tab-admin" class="tab-content hidden space-y-4">
      
      <!-- Admin Setup Card -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-200 dark:border-gray-700 space-y-3">
        <h2 class="font-bold text-base flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
          <i class="ph-bold ph-gear"></i> Admin & Employee Profile
        </h2>
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Admin Office Email</label>
          <input type="email" id="adminEmail" onchange="saveAdminSettings()" placeholder="payroll@company.com"
            class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl text-sm outline-none">
        </div>
        <div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Employee Name</label>
            <input type="text" id="employeeName" onchange="saveAdminSettings()" placeholder="John Doe"
              class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl text-sm outline-none">
          </div>
        </div>
      </div>

      <!-- Export Action Card -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-200 dark:border-gray-700 space-y-4">
        <h2 class="font-bold text-base flex items-center gap-2">
          <i class="ph-bold ph-paper-plane text-indigo-600"></i> Submit Reimbursement
        </h2>

        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Select Period</label>
          <select id="exportPeriod" class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl text-sm outline-none">
            <option value="all">All Trips</option>
            <option value="this_month">This Month</option>
            <option value="last_month">Last Month</option>
          </select>
        </div>

        <!-- Summary Totals -->
        <div class="pt-2">
          <div class="bg-gray-50 dark:bg-gray-900 p-3 rounded-xl border border-gray-200 dark:border-gray-700 text-center">
            <div id="summaryTotalMiles" class="text-xl font-bold text-indigo-600 dark:text-indigo-400">0.0</div>
            <div class="text-xs text-gray-500">Total Miles</div>
          </div>
        </div>

        <div class="space-y-2 pt-2">
          <button onclick="sendEmailToAdmin()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md active:scale-[0.98] transition flex justify-center items-center gap-2">
            <i class="ph-bold ph-envelope-simple text-xl"></i> Email Report to Admin
          </button>
          <button onclick="exportCSV()" class="w-full py-2.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold rounded-xl active:scale-[0.98] transition flex justify-center items-center gap-2 text-sm">
            <i class="ph-bold ph-download-simple text-lg"></i> Download CSV File
          </button>
        </div>
      </div>

    </section>

  </main>

  <footer class="text-center text-xs text-gray-500 dark:text-gray-400 pb-20">
    <a href="./privacy.html" class="hover:underline">Privacy Policy</a>
  </footer>

  <!-- Bottom Navigation Bar (Android Native Feel) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 pb-safe z-30">
    <div class="max-w-md mx-auto grid grid-cols-3 h-16">
      <button onclick="switchTab('log')" id="nav-log" class="nav-btn flex flex-col items-center justify-center text-indigo-600 dark:text-indigo-400 font-medium text-xs">
        <i class="ph-bold ph-plus-circle text-2xl mb-0.5"></i> Log Trip
      </button>
      <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex flex-col items-center justify-center text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium text-xs">
        <i class="ph-bold ph-list-bullets text-2xl mb-0.5"></i> History
      </button>
      <button onclick="switchTab('admin')" id="nav-admin" class="nav-btn flex flex-col items-center justify-center text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium text-xs">
        <i class="ph-bold ph-paper-plane-tilt text-2xl mb-0.5"></i> Submit / Admin
      </button>
    </div>
  </nav>

  <!-- Application Logic -->
  <script>
    let trips = JSON.parse(localStorage.getItem('company_trips') || '[]');
    let adminSettings = JSON.parse(localStorage.getItem('admin_settings') || '{"adminEmail":"","employeeName":""}');
    let gpsWatchId = null;
    let gpsStartCoords = null;
    let totalGpsDistance = 0;

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('tripDate').valueAsDate = new Date();
      loadAdminSettings();
      autoFillStartMileage();
      renderHistory();
      updateSummaries();
      
      document.getElementById('clientInitials').addEventListener('input', (e) => {
        e.target.value = e.target.value.toUpperCase();
      });
    });

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => {
        el.classList.remove('text-indigo-600', 'dark:text-indigo-400');
        el.classList.add('text-gray-400');
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${tabName}`);
      activeNav.classList.add('text-indigo-600', 'dark:text-indigo-400');
      activeNav.classList.remove('text-gray-400');

      if (tabName === 'admin') updateSummaries();
    }

    function calculateTripDistance() {
      const start = parseFloat(document.getElementById('startMileage').value) || 0;
      const end = parseFloat(document.getElementById('endMileage').value) || 0;
      const dist = Math.max(0, end - start);
      document.getElementById('calculatedDistance').innerText = `${dist.toFixed(1)} mi`;
      return dist;
    }

    function autoFillStartMileage() {
      if (trips.length > 0) {
        const lastEnd = trips[0].endMileage;
        document.getElementById('startMileage').value = lastEnd;
        calculateTripDistance();
      }
    }

    function saveTrip(e) {
      e.preventDefault();
      const start = parseFloat(document.getElementById('startMileage').value);
      const end = parseFloat(document.getElementById('endMileage').value);

      if (end < start) {
        alert("End mileage cannot be less than Start mileage.");
        return;
      }

      const newTrip = {
        id: Date.now(),
        date: document.getElementById('tripDate').value,
        startMileage: start,
        endMileage: end,
        distance: parseFloat((end - start).toFixed(1)),
        destination: document.getElementById('destination').value,
        reason: document.getElementById('reason').value,
        clientInitials: document.getElementById('clientInitials').value.toUpperCase(),
      };

      trips.unshift(newTrip);
      localStorage.setItem('company_trips', JSON.stringify(trips));

      document.getElementById('destination').value = '';
      document.getElementById('reason').value = '';
      document.getElementById('clientInitials').value = '';
      document.getElementById('endMileage').value = '';
      autoFillStartMileage();
      
      alert('Trip logged successfully!');
      switchTab('history');
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = trips.filter(t => 
        t.destination.toLowerCase().includes(search) || 
        t.clientInitials.toLowerCase().includes(search) ||
        t.reason.toLowerCase().includes(search)
      );

      if (filtered.length === 0) {
        historyList.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">No trip records found.</div>`;
        return;
      }

      historyList.innerHTML = filtered.map(t => `
        <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm flex justify-between items-center">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 px-2 py-0.5 rounded">${t.clientInitials}</span>
              <span class="text-xs text-gray-500">${t.date}</span>
            </div>
            <div class="font-bold text-sm text-gray-900 dark:text-gray-100">${t.destination}</div>
            <div class="text-xs text-gray-500">${t.reason} • ${t.startMileage} -> ${t.endMileage} mi</div>
          </div>
          <div class="text-right">
            <div class="text-base font-extrabold text-indigo-600 dark:text-indigo-400">+${t.distance} mi</div>
            <button onclick="deleteTrip(${t.id})" class="text-xs text-rose-500 hover:underline mt-1">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function deleteTrip(id) {
      if (confirm('Delete this trip record?')) {
        trips = trips.filter(t => t.id !== id);
        localStorage.setItem('company_trips', JSON.stringify(trips));
        renderHistory();
      }
    }

    function loadAdminSettings() {
      document.getElementById('adminEmail').value = adminSettings.adminEmail || '';
      document.getElementById('employeeName').value = adminSettings.employeeName || '';
    }

    function saveAdminSettings() {
      adminSettings = {
        adminEmail: document.getElementById('adminEmail').value,
        employeeName: document.getElementById('employeeName').value
      };
      localStorage.setItem('admin_settings', JSON.stringify(adminSettings));
      updateSummaries();
    }

    function getFilteredTrips() {
      const period = document.getElementById('exportPeriod').value;
      const now = new Date();
      return trips.filter(t => {
        const tripDate = new Date(t.date);
        if (period === 'this_month') {
          return tripDate.getMonth() === now.getMonth() && tripDate.getFullYear() === now.getFullYear();
        } else if (period === 'last_month') {
          const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          return tripDate.getMonth() === lastMonth.getMonth() && tripDate.getFullYear() === lastMonth.getFullYear();
        }
        return true;
      });
    }

    function updateSummaries() {
      const activeTrips = getFilteredTrips();
      const totalMiles = activeTrips.reduce((sum, t) => sum + t.distance, 0);

      document.getElementById('summaryTotalMiles').innerText = totalMiles.toFixed(1);
    }

    function sendEmailToAdmin() {
      const adminEmail = adminSettings.adminEmail;
      if (!adminEmail) {
        alert("Please set the Admin Office Email address in the profile section above first.");
        return;
      }

      const activeTrips = getFilteredTrips();
      const totalMiles = activeTrips.reduce((sum, t) => sum + t.distance, 0);
      const empName = adminSettings.employeeName || "Employee";

      let subject = encodeURIComponent(`Mileage Reimbursement Request - ${empName}`);
      let bodyText = `Hi Admin Team,\n\nPlease find my company mileage report details below for reimbursement processing:\n\n` +
        `Employee Name: ${empName}\n` +
        `Total Mileage: ${totalMiles.toFixed(1)} miles\n` +
        `\n` +
        `Trip Summary Breakdown:\n` +
        `----------------------------------------\n`;

      activeTrips.forEach(t => {
        bodyText += `${t.date} | ${t.destination} (${t.clientInitials}) | ${t.reason} | ${t.distance} mi\n`;
      });

      bodyText += `\nThank you!`;

      window.location.href = `mailto:${adminEmail}?subject=${subject}&body=${encodeURIComponent(bodyText)}`;
    }

    function exportCSV() {
      const activeTrips = getFilteredTrips();
      if (activeTrips.length === 0) {
        alert("No trip records available for the selected period.");
        return;
      }

      let csv = "Date,Start Mileage,End Mileage,Total Miles,Destination,Reason,Client Initials\n";
      activeTrips.forEach(t => {
        csv += `"${t.date}",${t.startMileage},${t.endMileage},${t.distance},"${t.destination}","${t.reason}","${t.clientInitials}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Mileage_Report_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function startGpsTracking() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your mobile browser.");
        return;
      }

      totalGpsDistance = 0;
      gpsStartCoords = null;

      document.getElementById('gpsStatusText').innerText = "Tracking Live";
      document.getElementById('gpsStatusText').className = "text-xs px-2 py-0.5 rounded bg-emerald-900 text-emerald-300 font-bold animate-pulse";
      document.getElementById('gpsDot').className = "relative inline-flex rounded-full h-3 w-3 bg-emerald-500";
      document.getElementById('gpsPulse').classList.remove('hidden');

      document.getElementById('btnStartGps').disabled = true;
      document.getElementById('btnStartGps').classList.add('opacity-50', 'cursor-not-allowed');
      document.getElementById('btnStopGps').disabled = false;
      document.getElementById('btnStopGps').classList.remove('bg-rose-600/50', 'text-gray-400', 'cursor-not-allowed');
      document.getElementById('btnStopGps').classList.add('bg-rose-600', 'hover:bg-rose-500', 'text-white');

      gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          if (gpsStartCoords) {
            const addedMiles = calculateHaversineMiles(gpsStartCoords.lat, gpsStartCoords.lon, lat, lon);
            if (addedMiles > 0.02) {
              totalGpsDistance += addedMiles;
              gpsStartCoords = { lat, lon };
            }
          } else {
            gpsStartCoords = { lat, lon };
          }

          document.getElementById('gpsMiles').innerText = totalGpsDistance.toFixed(1);
        },
        (err) => alert("Error accessing GPS location: " + err.message),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    function stopGpsTracking() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }

      document.getElementById('gpsStatusText').innerText = "Stopped";
      document.getElementById('gpsStatusText').className = "text-xs px-2 py-0.5 rounded bg-indigo-900 text-indigo-300";
      document.getElementById('gpsDot').className = "relative inline-flex rounded-full h-3 w-3 bg-gray-500";
      document.getElementById('gpsPulse').classList.add('hidden');

      document.getElementById('btnStartGps').disabled = false;
      document.getElementById('btnStartGps').classList.remove('opacity-50', 'cursor-not-allowed');
      document.getElementById('btnStopGps').disabled = true;
      document.getElementById('btnStopGps').className = "py-2.5 px-3 bg-rose-600/50 text-gray-400 font-semibold rounded-xl text-sm flex items-center justify-center gap-2 cursor-not-allowed transition shadow";

      const startMiles = parseFloat(document.getElementById('startMileage').value) || 0;
      if (startMiles > 0) {
        document.getElementById('endMileage').value = (startMiles + totalGpsDistance).toFixed(1);
        calculateTripDistance();
      }
    }

    function calculateHaversineMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch((error) => {
          console.error('Service worker registration failed:', error);
        });
      });
    }
  </script>
